<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2"); }
      @font-face { font-family: "Geist"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); }
      @font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/GeistMono-Variable.woff2") format("woff2"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #1A1A18; font-family: "Geist", system-ui, sans-serif; }
      :root { --ink: #1A1A1A; --cream: #FAF9F6; --navy: #1A1A18; --navy-soft: #211F1D; --navy-elev: #262320; --accent: #4A3AFF; --error: #C4384B; --ink-muted: #9a978f; }
      .clip { position: absolute; inset: 0; container-type: size; }

      .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; padding: 0 160px; }
      .kicker { font-family: "Geist Mono"; font-size: 22px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); display: flex; align-items: center; gap: 12px; }
      .kicker .spike { color: var(--error); font-size: 24px; }
      .heading { font-family: "Instrument Serif"; font-size: 116px; line-height: 0.98; letter-spacing: -0.028em; color: var(--cream); text-align: center; }
      .heading em { font-style: italic; color: var(--error); }

      .countdown { display: flex; align-items: baseline; gap: 18px; }
      .countdown .fig { font-family: "Instrument Serif"; font-size: 210px; line-height: 0.9; color: var(--cream); font-variant-numeric: tabular-nums; }
      .countdown .unit { font-family: "Geist Mono"; font-size: 40px; color: var(--ink-muted); }
      .countdown .label { font-family: "Geist Mono"; font-size: 24px; color: var(--ink-muted); letter-spacing: 0.08em; }

      .deadrow { width: 1180px; display: flex; gap: 22px; align-items: stretch; }
      .urlbox { flex: 1; background: var(--navy-elev); border: 1px solid rgba(250,249,246,0.14); border-radius: 12px; padding: 24px 30px; position: relative; overflow: hidden; }
      .urlbox .url { font-family: "Geist Mono"; font-size: 20px; color: #d9d5cc; word-break: break-all; line-height: 1.5; }
      .urlbox .url .q { color: #9fbfda; }
      .urlbox .strike { position: absolute; top: 50%; left: 20px; right: 20px; height: 3px; background: var(--error); transform: translateY(-50%) scaleX(0); transform-origin: left; }
      .deadchip { display: inline-flex; align-items: center; justify-content: center; align-self: center; flex-shrink: 0; font-family: "Geist Mono"; font-size: 20px; font-weight: 600; color: #fff; background: var(--error); border-radius: 14px; padding: 22px 28px; opacity: 0; }

      .gone { font-family: "Instrument Serif"; font-style: italic; font-size: 96px; color: var(--error); opacity: 0; }

      .caption { position: absolute; left: 0; right: 0; bottom: 60px; display: flex; justify-content: center; }
      .caption span { font-family: "Geist"; font-size: 30px; font-weight: 500; color: var(--cream); background: rgba(38,35,32,0.7); border: 1px solid rgba(250,249,246,0.12); padding: 10px 28px; border-radius: 9999px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="f06" data-start="0" data-width="1920" data-height="1080" data-duration="10.04">
      <div id="f06-scene" class="clip" data-start="0" data-duration="10.04" data-track-index="1">
        <div class="stage">
          <div id="f06-kicker" class="kicker"><span class="spike">✱</span><span>generative media has a half-life</span></div>
          <h1 id="f06-heading" class="heading">Signed URLs <em>expire.</em></h1>
          <div id="f06-countdown" class="countdown">
            <span id="f06-fig" class="fig">24</span><span class="unit">hours</span>
            <span class="label">until the link dies</span>
          </div>
          <div class="deadrow">
            <div id="f06-urlbox" class="urlbox">
              <div class="url">https://files2.heygen.ai/aws_pacific/avatar_tmp/…/23c515…c3.mp4<span class="q">?Expires=1783464617&amp;Signature=Rey-aSmk4swZ…&amp;Key-Pair-Id=K38HBHX…</span></div>
              <div id="f06-strike" class="strike"></div>
            </div>
            <span class="deadchip">EXPIRED</span>
          </div>
          <div id="f06-gone" class="gone">Gone.</div>
        </div>
        <div id="f06-caption" class="caption"><span>Every share link — gone in a day.</span></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#f06-kicker", "#f06-heading", "#f06-countdown", "#f06-urlbox"], { opacity: 0, y: 24 });

      tl.to("#f06-kicker", { opacity: 1, y: 0, duration: 0.4 }, 0.3)
        .to("#f06-heading", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.5)
        .to("#f06-countdown", { opacity: 1, y: 0, duration: 0.5 }, 1.6);

      // countdown 24 -> 0
      const c = { v: 24 };
      const fig = document.getElementById("f06-fig");
      tl.to(c, { v: 0, duration: 2.4, ease: "power2.in", onUpdate: () => { fig.textContent = Math.round(c.v); } }, 2.4);

      tl.to("#f06-urlbox", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.0)
        .to("#f06-strike", { scaleX: 1, duration: 0.4, ease: "power3.in" }, 6.6)
        .to(".deadchip", { opacity: 1, duration: 0.25 }, 7.0)
        .to("#f06-gone", { opacity: 1, duration: 0.5 }, 7.4)
        .to("#f06-caption", { opacity: 1, y: 0, duration: 0.4 }, 7.8);

      window.__timelines["f06"] = tl;
    </script>
  </body>
</html>
