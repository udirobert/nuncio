<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2"); }
      @font-face { font-family: "Geist"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); }
      @font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/GeistMono-Variable.woff2") format("woff2"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #FAF9F6; font-family: "Geist", system-ui, sans-serif; }
      :root { --ink: #1A1A1A; --cream: #FAF9F6; --tile: #F7F5F1; --tile-strong: #F0EDE8; --accent: #4A3AFF; --warm: #C4704B; --ink-muted: #6B6B6B; --ink-faint: #A3A3A3; }
      .clip { position: absolute; inset: 0; container-type: size; }

      .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 30px; padding: 0 140px; }
      .kicker { font-family: "Geist Mono"; font-size: 24px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); display: flex; align-items: center; gap: 14px; }
      .kicker .spike { color: var(--accent); font-size: 26px; }

      .display { font-family: "Instrument Serif"; font-weight: 400; font-size: 158px; line-height: 0.98; letter-spacing: -0.028em; color: var(--ink); min-height: 1.05em; }
      .display em { font-style: italic; color: var(--accent); }

      .ribbon { display: flex; align-items: center; gap: 14px; }
      .step { font-family: "Geist Mono"; font-size: 24px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); background: var(--tile); border: 1px solid rgba(26,26,26,0.12); border-radius: 9999px; padding: 12px 30px; }
      .arrow { font-family: "Geist"; font-size: 26px; color: var(--ink-faint); }
      .step.auto { background: var(--accent); color: #fff; border-color: var(--accent); }

      .caption { position: absolute; left: 0; right: 0; bottom: 64px; display: flex; justify-content: center; }
      .caption span { font-family: "Geist"; font-size: 30px; font-weight: 500; color: var(--ink); background: rgba(250,249,246,0.85); border: 1px solid rgba(26,26,26,0.1); padding: 10px 28px; border-radius: 9999px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="f02" data-start="0" data-width="1920" data-height="1080" data-duration="9.95">
      <div id="f02-scene" class="clip" data-start="0" data-duration="9.95" data-track-index="1">
        <div class="stage">
          <div id="f02-kicker" class="kicker"><span class="spike">✱</span><span>not a video tool</span></div>
          <h1 id="f02-display" class="display"></h1>
          <div id="f02-ribbon" class="ribbon">
            <span class="step">Research</span><span class="arrow">→</span>
            <span class="step">Synthesis</span><span class="arrow">→</span>
            <span class="step">Script</span><span class="arrow">→</span>
            <span class="step">Render</span><span class="arrow">→</span>
            <span class="step">Delivery</span><span class="arrow">→</span>
            <span class="step auto">Autonomous</span>
          </div>
        </div>
        <div id="f02-caption" class="caption"><span>It's a conversational SDR — the whole loop runs without you.</span></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const display = document.getElementById("f02-display");

      gsap.set(["#f02-kicker", "#f02-ribbon", "#f02-caption"], { opacity: 0, y: 26 });
      gsap.set("#f02-ribbon .step", { opacity: 0, y: 16 });
      gsap.set("#f02-ribbon .arrow", { opacity: 0 });

      tl.to("#f02-kicker", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.2)
        .add(() => { display.innerHTML = "A video tool?"; }, 0.9)
        .fromTo("#f02-display", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.9)
        // swap to the claim
        .add(() => { display.innerHTML = "A <em>conversational</em> SDR."; }, 2.6)
        .fromTo("#f02-display", { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 2.6)
        // ribbon cascades in
        .to("#f02-ribbon", { opacity: 1, y: 0, duration: 0.3 }, 4.4)
        .to("#f02-ribbon .step", { opacity: 1, y: 0, duration: 0.35, stagger: 0.22, ease: "back.out(1.8)" }, 4.6)
        .to("#f02-ribbon .arrow", { opacity: 1, duration: 0.25, stagger: 0.22 }, 4.75)
        .to("#f02-caption", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 5.2);

      window.__timelines["f02"] = tl;
    </script>
  </body>
</html>
