<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2"); }
      @font-face { font-family: "Geist"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); }
      @font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/GeistMono-Variable.woff2") format("woff2"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #FAF9F6; font-family: "Geist", system-ui, sans-serif; }
      :root {
        --ink: #1A1A1A; --cream: #FAF9F6; --tile: #F7F5F1; --tile-strong: #F0EDE8;
        --accent: #4A3AFF; --warm: #C4704B; --ink-muted: #6B6B6B; --ink-faint: #A3A3A3;
      }
      .clip { position: absolute; inset: 0; container-type: size; }

      .kicker { font-family: "Geist Mono"; font-size: 24px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); display: flex; align-items: center; gap: 14px; }
      .kicker .spike { color: var(--accent); font-size: 26px; }

      .headline { font-family: "Instrument Serif"; font-weight: 400; font-size: 150px; line-height: 1.0; letter-spacing: -0.022em; color: var(--ink); }
      .sub { font-family: "Geist"; font-size: 38px; font-weight: 400; color: var(--ink-muted); line-height: 1.4; }

      .input-card { width: 900px; background: #fff; border: 1px solid rgba(26,26,26,0.12); border-radius: 12px; box-shadow: 0 1px 3px rgba(26,26,26,0.08), 0 4px 16px rgba(26,26,26,0.04); padding: 26px 30px; display: flex; align-items: center; gap: 20px; }
      .input-label { font-family: "Geist Mono"; font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); flex-shrink: 0; }
      .url-text { font-family: "Geist Mono"; font-size: 34px; font-weight: 500; color: var(--ink); white-space: nowrap; }
      .caret { display: inline-block; width: 3px; height: 40px; background: var(--accent); margin-left: 2px; vertical-align: middle; }

      .btn { font-family: "Geist"; font-size: 30px; font-weight: 600; color: #fff; background: var(--ink); border-radius: 9999px; padding: 16px 46px; display: inline-block; }
      .btn.hot { background: var(--accent); }

      .caption { position: absolute; left: 0; right: 0; bottom: 64px; display: flex; justify-content: center; }
      .caption span { font-family: "Geist"; font-size: 30px; font-weight: 500; color: var(--ink); background: rgba(250,249,246,0.85); border: 1px solid rgba(26,26,26,0.1); padding: 10px 28px; border-radius: 9999px; }

      .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 34px; padding: 0 120px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="f01" data-start="0" data-width="1920" data-height="1080" data-duration="6.47">
      <div id="f01-scene" class="clip" data-start="0" data-duration="6.47" data-track-index="1">
        <div class="stage">
          <div id="f01-kicker" class="kicker"><span class="spike">✱</span><span>one url in</span></div>
          <h1 id="f01-headline" class="headline">Brief an agent.</h1>
          <p id="f01-sub" class="sub">Get a personalized video from any profile.</p>
          <div id="f01-input" class="input-card">
            <span class="input-label">URL</span>
            <span class="url-text"><span id="f01-typed"></span><span id="f01-caret" class="caret"></span></span>
          </div>
          <div id="f01-btn" class="btn">Build</div>
        </div>
        <div id="f01-caption" class="caption"><span>Meet Nuncio. You give it one URL — you get back a personalized video.</span></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const URL = "eladgil.com";
      const typed = document.getElementById("f01-typed");

      // initial states
      gsap.set(["#f01-kicker","#f01-headline","#f01-sub","#f01-input","#f01-btn","#f01-caption"], { opacity: 0, y: 26 });

      tl.to("#f01-kicker", { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.15)
        .to("#f01-headline", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.4)
        .to("#f01-sub", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.7)
        .to("#f01-input", { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.6)" }, 1.0)
        .to("#f01-caption", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.2);

      // deterministic typing
      const typeObj = { p: 0 };
      tl.to(typeObj, {
        p: 1, duration: 2.3, ease: "none",
        onUpdate: () => { typed.textContent = URL.slice(0, Math.round(typeObj.p * URL.length)); }
      }, 1.6);

      // caret blink (stepped)
      tl.fromTo("#f01-caret", { opacity: 1 }, { opacity: 0, duration: 0.42, repeat: 6, yoyo: true, ease: "steps(1)" }, 1.6);

      // button highlight
      tl.to("#f01-btn", { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 1.3)
        .add(() => document.getElementById("f01-btn").classList.add("hot"), 4.1)
        .to("#f01-btn", { scale: 1.06, duration: 0.25, ease: "back.out(2)" }, 4.1)
        .to("#f01-btn", { scale: 1, duration: 0.2 }, 4.45);

      window.__timelines["f01"] = tl;
    </script>
  </body>
</html>
