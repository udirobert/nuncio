<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2"); }
      @font-face { font-family: "Geist"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); }
      @font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/GeistMono-Variable.woff2") format("woff2"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #FAF9F6; font-family: "Geist", system-ui, sans-serif; }
      :root { --ink: #1A1A1A; --cream: #FAF9F6; --tile: #F7F5F1; --tile-strong: #F0EDE8; --accent: #4A3AFF; --warm: #C4704B; --ink-muted: #6B6B6B; --ink-faint: #A3A3A3; }
      .clip { position: absolute; inset: 0; container-type: size; }

      .real-badge { position: absolute; top: 64px; left: 120px; display: flex; align-items: center; gap: 14px; }
      .real-badge .spike { color: var(--accent); font-size: 26px; font-family: "Geist Mono"; }
      .real-badge .txt { font-family: "Geist Mono"; font-size: 22px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); }

      .browser { position: absolute; top: 130px; left: 50%; transform: translateX(-50%); width: 1260px; background: #fff; border: 1px solid rgba(26,26,26,0.14); border-radius: 14px; box-shadow: 0 12px 40px rgba(26,26,26,0.14); overflow: hidden; }
      .bbar { display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-bottom: 1px solid rgba(26,26,26,0.08); background: var(--tile); }
      .dot { width: 12px; height: 12px; border-radius: 50%; }
      .dot.r { background: #ff5f56; } .dot.y { background: #ffbd2e; } .dot.g { background: #27c93f; }
      .urlpill { flex: 1; text-align: center; font-family: "Geist Mono"; font-size: 18px; color: var(--ink-muted); background: #fff; border: 1px solid rgba(26,26,26,0.1); border-radius: 9999px; padding: 7px 0; margin: 0 40px; }

      .sharehead { padding: 26px 34px 18px; display: flex; align-items: baseline; gap: 16px; }
      .sharehead .hi { font-family: "Instrument Serif"; font-size: 44px; color: var(--ink); }
      .sharehead .name { font-family: "Instrument Serif"; font-style: italic; font-size: 44px; color: var(--accent); }
      .sharehead .note { font-family: "Geist"; font-size: 22px; color: var(--ink-faint); }

      .video-area { width: 100%; aspect-ratio: 16/9; background: #0d0d0f; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      .video-area video { width: 100%; height: 100%; object-fit: cover; }

      .ctarow { padding: 18px 34px 26px; display: flex; align-items: center; gap: 16px; }
      .ctarow .btn { font-family: "Geist"; font-size: 24px; font-weight: 600; padding: 12px 34px; border-radius: 9999px; }
      .btn.primary { background: var(--ink); color: #fff; }
      .btn.ghost { border: 1px solid rgba(26,26,26,0.2); color: var(--ink); }
      .ctarow .proofline { margin-left: auto; font-family: "Geist Mono"; font-size: 18px; color: var(--ink-faint); }

      .lowerthird { position: absolute; top: 820px; left: 50%; transform: translateX(-50%); background: rgba(26,26,26,0.92); color: #fff; border-radius: 12px; padding: 16px 34px; display: flex; align-items: center; gap: 24px; }
      .lowerthird .who { font-family: "Instrument Serif"; font-style: italic; font-size: 34px; }
      .lowerthird .meta { font-family: "Geist Mono"; font-size: 19px; color: rgba(255,255,255,0.75); }

      .caption { position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; }
      .caption span { font-family: "Geist"; font-size: 30px; font-weight: 500; color: var(--ink); background: rgba(250,249,246,0.85); border: 1px solid rgba(26,26,26,0.1); padding: 10px 28px; border-radius: 9999px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="f05" data-start="0" data-width="1920" data-height="1080" data-duration="15.83">
      <div id="f05-scene" class="clip" data-start="0" data-duration="15.83" data-track-index="1">
        <div id="f05-badge" class="real-badge"><span class="spike">✱</span><span class="txt">this is real output</span></div>

        <div id="f05-browser" class="browser">
          <div class="bbar">
            <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
            <span class="urlpill">nuncio.persidian.com/v/b46b1f69-3f0</span>
            <span class="dot" style="opacity:0"></span><span class="dot" style="opacity:0"></span><span class="dot" style="opacity:0"></span>
          </div>
          <div id="f05-sharehead" class="sharehead">
            <span class="hi">Hey</span><span class="name">Elad Gil</span>
            <span class="note">Nuncio Agent recorded this for you</span>
          </div>
          <div class="video-area">
            <video id="f05-video" src="assets/avatar-talking.mp4" muted playsinline data-start="3.9" data-duration="5.52" data-track-index="2"></video>
          </div>
          <div id="f05-ctarow" class="ctarow">
            <span class="btn primary">Say thanks</span>
            <span class="btn ghost">Send one back</span>
            <span class="proofline">researched · written · rendered by AI</span>
          </div>
        </div>

        <div id="f05-lt" class="lowerthird">
          <span class="who">Personalized for this one recipient</span>
          <span class="meta">prospect: Elad Gil · sender: Nuncio Agent</span>
        </div>

        <div id="f05-caption" class="caption"><span>Watch — the avatar speaks. This is real output.</span></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set(["#f05-badge", "#f05-browser", "#f05-lt", "#f05-caption"], { opacity: 0, y: 26 });
      gsap.set("#f05-lt", { y: 20 });

      // build the share page (0 – ~3.5s, during VO "This is real output. Watch.")
      tl.to("#f05-badge", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.3)
        .to("#f05-browser", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.6)
        .to("#f05-caption", { opacity: 1, y: 0, duration: 0.4 }, 1.2);

      // lower-third arrives with VO 05b (~local 10.2s)
      tl.to("#f05-lt", { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, 10.2);

      window.__timelines["f05"] = tl;
    </script>
  </body>
</html>
