name: agent-image

# Manual-only: GitHub-hosted runners get 429s pulling the base image from
# public.ecr.aws (shared anonymous quota). Release flow is `docker build` +
# `docker push` from an amd64 host (see openclaw-agent/README.md). This
# workflow remains for manual runs once a base mirror exists.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: openclaw-agent
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nuncio-openclaw:latest
            ghcr.io/${{ github.repository_owner }}/nuncio-openclaw:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
